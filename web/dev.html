<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JARVIS gesture engine: test page</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #0a0c10; color: #d8d2c0; font: 14px/1.5 ui-monospace, Menlo, monospace; }
    main { max-width: 520px; margin: 0 0 0 auto; padding: 24px; }
    button { font: inherit; color: #0a0c10; background: #e8d9a8; border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
    #badge { display: inline-block; margin-left: 12px; padding: 4px 10px; border: 1px solid #e8d9a8; border-radius: 999px; }
    #badge.awake { background: #e8d9a8; color: #0a0c10; }
    #bar { height: 4px; margin: 16px 0; background: #1c2028; } #bar i { display: block; height: 100%; width: 0; background: #e8d9a8; }
    #log { margin: 0; padding: 0; list-style: none; } #log li { padding: 2px 0; border-bottom: 1px solid #1c2028; }
    #cursor { position: fixed; width: 28px; height: 28px; margin: -14px; border: 1.5px solid #e8d9a8; border-radius: 50%; pointer-events: none; display: none; }
    #cursor.pinched { background: rgba(232, 217, 168, .4); }
    p { color: #8a8676; }
  </style>
</head>
<body>
  <div id="cursor"></div>
  <main>
    <button id="start">Start</button><span id="badge">ASLEEP</span>
    <p>Hold an open palm 1 s to wake (or press W). S sleeps. Shift+D toggles the debug panel.</p>
    <div id="bar"><i></i></div>
    <p id="perf">perf: waiting for frames</p>
    <ul id="log"></ul>
  </main>
  <script type="module">
    import { GestureEngine } from './src/gestures.js';
    const engine = (window.jarvis = new GestureEngine());
    const $ = (s) => document.querySelector(s);
    const log = (text) => {
      const li = document.createElement('li');
      li.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
      $('#log').prepend(li);
      while ($('#log').children.length > 40) $('#log').lastChild.remove();
    };
    engine.on('gesture', (d) => log(`gesture:${d.name}`));
    engine.on('state:change', (d) => {
      $('#badge').textContent = d.state;
      $('#badge').classList.toggle('awake', d.state === 'AWAKE');
      log(`state -> ${d.state} (${d.reason})`);
    });
    engine.on('engine:ready', () => log('engine ready'));
    engine.on('engine:error', (d) => log(`ERROR ${d.message}`));
    engine.on('hold:progress', (d) => { $('#bar i').style.width = `${d.progress * 100}%`; });
    engine.on('hand:move', (d) => {
      const c = $('#cursor');
      c.style.display = 'block';
      c.style.left = `${d.x * innerWidth}px`;
      c.style.top = `${d.y * innerHeight}px`;
      c.classList.toggle('pinched', d.pinched);
    });
    engine.on('perf', (d) => {
      $('#perf').textContent = `${Math.round(d.fps)} fps · latency ${Math.round(d.latencyMs)} ms (p95 ${Math.round(d.latencyP95Ms)}) · detect ${d.detectMs.toFixed(1)} ms · ${d.delegate} ${d.input} via ${d.driver}, clock ${d.clock}`;
    });
    engine.on('hand:lost', () => { $('#cursor').style.display = 'none'; });
    $('#start').onclick = async () => {
      $('#start').disabled = true;
      try { await engine.start({ debug: true }); } catch { $('#start').disabled = false; }
    };
    addEventListener('keydown', (e) => {
      if (e.key === 'w') engine.wake('key');
      if (e.key === 's') engine.sleep('key');
    });
  </script>
</body>
</html>
